# 每天读个人站点后端 site-api 的公开接口(/api/learning/duolingo-history),刷新本仓库 README 的徽章段落。
# 数据采集在 k3s 上每天北京 04:30 跑(源码在 maxhello.github.io 的 site-api/),这里只消费结果,零密钥。
name: duolingo-badge

on:
  schedule:
    - cron: '37 21 * * *' # 北京 05:37,晚于 04:30 的采集(GitHub 定时会再晚几小时,不影响)
  workflow_dispatch: # 支持手动触发,方便调试

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_badge.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: refresh duolingo badge" && git push)
